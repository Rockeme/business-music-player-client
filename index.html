<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Configuración del servicio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #303030;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: #424242;
            border-radius: 8px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: #9e9e9e;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: #bdbdbd;
        }

        input[type="url"] {
            width: 100%;
            padding: 10px 12px;
            background-color: #303030;
            border: 1px solid #616161;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus {
            border-color: #90caf9;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 11px;
            background-color: #1976d2;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1565c0;
        }

        #error-msg {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #ef9a9a;
            min-height: 16px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Configuración del servicio</h1>
        <p class="subtitle">Ingresa la URL base del servidor al que deseas conectarte.</p>
        <form id="url-form">
            <label for="urlService">URL del servicio</label>
            <input
                type="url"
                id="urlService"
                name="urlService"
                placeholder="http://localhost/business-music-player"
                required
                autocomplete="off"
            />
            <p id="error-msg"></p>
            <button type="submit">Conectar</button>
        </form>
    </div>
    <script src="./renderer.js"></script>
</body>

</html>
