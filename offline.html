<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file:">
    <title>Reproducción sin conexión</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #303030;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Top bar ─────────────────────────────────────────── */
        #status-bar {
            background: #212121;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #9e9e9e;
            border-bottom: 1px solid #424242;
            flex-shrink: 0;
        }

        #status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ef5350;
            flex-shrink: 0;
        }

        #status-dot.checking { background: #ffa726; }

        /* ── Now-playing section ─────────────────────────────── */
        #now-playing {
            background: #3a3a3a;
            padding: 24px 20px 20px;
            flex-shrink: 0;
            border-bottom: 1px solid #424242;
        }

        #now-playing h2 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #757575;
            margin-bottom: 6px;
        }

        #song-title {
            font-size: 1.15rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 16px;
        }

        audio {
            width: 100%;
            height: 36px;
            accent-color: #1976d2;
        }

        /* ── Controls ────────────────────────────────────────── */
        #controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
        }

        .ctrl-btn {
            background: #1976d2;
            border: none;
            border-radius: 50%;
            width: 40px; height: 40px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .ctrl-btn:hover { background: #1565c0; }
        .ctrl-btn:disabled { background: #555; cursor: default; }

        /* ── Song list ───────────────────────────────────────── */
        #list-header {
            padding: 14px 20px 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #757575;
            flex-shrink: 0;
        }

        #song-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px;
        }

        #song-list::-webkit-scrollbar { width: 6px; }
        #song-list::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        .song-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.1s;
        }
        .song-item:hover { background: #424242; }
        .song-item.active { background: #1a3a5c; }

        .song-num {
            width: 22px;
            font-size: 0.75rem;
            color: #757575;
            text-align: right;
            flex-shrink: 0;
        }
        .song-item.active .song-num { color: #42a5f5; }

        .song-name {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-item.active .song-name { color: #42a5f5; }

        /* ── Reconnection banner ─────────────────────────────── */
        #reconnect-banner {
            display: none;
            background: #1b3a1f;
            border-top: 1px solid #2e7d32;
            border-bottom: 1px solid #2e7d32;
            padding: 10px 20px;
            flex-shrink: 0;
            flex-direction: row;
            align-items: center;
            gap: 12px;
        }

        #reconnect-banner.visible { display: flex; }

        #reconnect-banner span {
            flex: 1;
            font-size: 0.85rem;
            color: #a5d6a7;
        }

        #btn-resume-online {
            background: #2e7d32;
            border: none;
            border-radius: 6px;
            padding: 7px 16px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        #btn-resume-online:hover { background: #1b5e20; }

        #empty-msg {
            display: none;
            text-align: center;
            padding: 40px 20px;
            color: #757575;
            font-size: 0.9rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="status-bar">
        <div id="status-dot"></div>
        <span id="status-text">Sin conexión — reproduciendo desde caché local</span>
    </div>

    <!-- Hidden until connectivity is restored -->
    <div id="reconnect-banner">
        <span id="reconnect-msg">Conexión restaurada — volviendo al servicio cuando termine la canción…</span>
        <button id="btn-resume-online">▶ Volver ahora</button>
    </div>

    <div id="now-playing">
        <h2>Reproduciendo ahora</h2>
        <div id="song-title">—</div>
        <audio id="player" controls></audio>
        <div id="controls">
            <button class="ctrl-btn" id="btn-prev" title="Anterior" disabled>&#9664;&#9664;</button>
            <button class="ctrl-btn" id="btn-next" title="Siguiente" disabled>&#9654;&#9654;</button>
        </div>
    </div>

    <div id="list-header">Canciones guardadas</div>

    <div id="song-list">
        <div id="empty-msg">
            No hay canciones guardadas todavía.<br>
            Mientras el servicio esté disponible, las canciones<br>
            reproducidas se guardan automáticamente aquí.
        </div>
    </div>

    <script src="./offline-renderer.js"></script>
</body>
</html>
